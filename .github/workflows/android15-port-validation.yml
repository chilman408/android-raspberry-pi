name: Android 15 port validation

on:
  push:
    branches:
      - android-15-bringup
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android15-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Validate Android 15 BSP baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate manifests and BSP migration
        run: bash tools/check-android15-port.sh

  patches:
    name: Apply all Android 15 patch series
    needs: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install source checkout prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes git-lfs
          git lfs install

      - name: Sync patched projects and apply every series
        run: bash tools/check-patches.sh
